app = "app-patientor-ah-2026"
primary_region = "gru"

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 3001
  min_machines_running = 0
  processes = [ "app" ]
  
[build]
  dockerfile = "Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  memory_mb = 1024
