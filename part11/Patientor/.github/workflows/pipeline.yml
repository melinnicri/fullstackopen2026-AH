name: Patientor Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- BACKEND ---
      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Build backend (si aplica)
        run: cd backend && npm run build --if-present

      # --- FRONTEND ---
      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    # El despliegue solo ocurre si pasa el build/test y es un PUSH directo o un merge a main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Deployment
        run: |
          echo "Desplegando la aplicación a producción..."
          # Aquí puedes poner el comando de despliegue de tu proveedor (Render Webhook, Fly CLI, etc.)
          # Ejemplo con un Webhook de Render:
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "¡Despliegue simulado/configurado con éxito!"